<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance - ServeNow</title>
    <link rel="icon" type="image/png" href="images/servenow_brand_logo.png?v=2" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 14px;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827;
        background: radial-gradient(1000px 500px at 50% -10%, #bbf7d0 0%, rgba(187, 247, 208, 0) 65%), #f3f6f4; }
      main { width: 100%; max-width: 440px; overflow: hidden; border-radius: 22px; background: #fff; box-shadow: 0 22px 50px rgba(20, 83, 45, .16); }
      .top { padding: 18px 20px 20px; color: #fff; background: linear-gradient(125deg, #14532d, #15803d); }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; font-weight: 700; }
      .brand img { width: 34px; height: 34px; object-fit: cover; object-position: left center; border-radius: 9px; background: #fff; }
      .brand span { margin-left: auto; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .15); font-size: 11.5px; font-weight: 600; }
      .who { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
      h1 { margin: 0; font-size: 21px; line-height: 1.2; }
      .sub { margin: 4px 0 0; color: #dcfce7; font-size: 13px; }
      .clock { flex: none; font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .body { padding: 16px 18px 18px; }
      .camera { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 16px; background: #0f172a; }
      video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      .guide { position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 3 / 4; transform: translate(-50%, -50%); border: 2px dashed rgba(255, 255, 255, .75); border-radius: 50%;
        box-shadow: 0 0 0 999px rgba(15, 23, 42, .28); pointer-events: none; }
      .guide-text { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 12.5px; font-weight: 600; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); pointer-events: none; }
      .status { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: #f3f4f6; color: #374151; font-size: 13px; font-weight: 500; }
      .status::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: #9ca3af; }
      .status.good { background: #f0fdf4; color: #166534; }
      .status.good::before { background: #16a34a; }
      .status.bad { background: #fef2f2; color: #b91c1c; }
      .status.bad::before { background: #dc2626; }
      .reasons-title { margin: 14px 0 7px; font-size: 13px; font-weight: 700; color: #374151; }
      .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .reasons button { min-height: 44px; padding: 8px 10px; border: 1.5px solid #e5e7eb; border-radius: 11px; background: #fff; color: #1f2937; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
      .reasons button:hover { border-color: #86efac; }
      .reasons button.is-on { border-color: #15803d; background: #f0fdf4; color: #14532d; }
      .action { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 13px; color: #fff; background: #15803d;
        font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px rgba(21, 128, 61, .28); transition: background .15s ease, transform .1s ease; }
      .action:hover:not(:disabled) { background: #166534; }
      .action:active:not(:disabled) { transform: translateY(1px); }
      .action.out { background: #b45309; box-shadow: 0 8px 18px rgba(180, 83, 9, .25); }
      .action.out:hover:not(:disabled) { background: #92400e; }
      .action:disabled { background: #e5e7eb; color: #6b7280; box-shadow: none; cursor: default; }
      .done { padding: 26px 12px 12px; text-align: center; }
      .tick { display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 12px; border-radius: 50%; color: #fff; background: #16a34a; font-size: 34px; animation: pop .35s ease; }
      .done.bad .tick { background: #dc2626; }
      .done p { margin: 0; font-size: 17px; font-weight: 700; color: #14532d; }
      .done.bad p { color: #b91c1c; font-size: 15px; font-weight: 600; }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      a { display: block; margin-top: 13px; text-align: center; color: #4b5563; font-size: 13.5px; font-weight: 600; text-decoration: none; }
      a:hover { color: #15803d; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div class="brand"><img src="images/servenow_brand_logo.png?v=2" alt="" /> ServeNow <span>Attendance</span></div>
        <div class="who">
          <div>
            <h1 id="who">Attendance</h1>
            <p class="sub" id="today"></p>
          </div>
          <div class="clock" id="clock"></div>
        </div>
      </div>
      <div class="body">
        <div class="camera" id="cameraBox" hidden>
          <video id="video" autoplay playsinline muted></video>
          <div class="guide"></div>
          <div class="guide-text">Keep your face inside the circle</div>
        </div>
        <div class="status" id="cameraLine" hidden></div>
        <div class="status" id="locationLine" hidden></div>
        <div class="reasons-title" id="reasonTitle" hidden>Why are you leaving?</div>
        <div class="reasons" id="reasons" hidden></div>
        <div class="done" id="doneBox" hidden><div class="tick" id="doneTick">&#10003;</div><p id="doneText"></p></div>
        <div class="status" id="resultLine" hidden></div>
        <button type="button" class="action" id="markButton" disabled>Please wait...</button>
        <a href="index.html" id="backLink">Back</a>
      </div>
    </main>
    <script src="js/attendance.js?v=4" defer></script>
  </body>
</html>
