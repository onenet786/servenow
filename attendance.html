<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance - ServeNow</title>
    <link rel="icon" type="image/png" href="images/servenow_brand_logo.png" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: #f3f4f6; color: #111827; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px; }
      h1 { margin: 0; font-size: 20px; }
      .sub { margin: 4px 0 14px; color: #4b5563; font-size: 14px; }
      .camera { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #111827; }
      video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
      .line { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 14px; color: #374151; }
      .line.bad { color: #b91c1c; }
      .line.good { color: #166534; }
      button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px; background: #15803d; color: #fff;
        font-size: 16px; font-weight: 700; cursor: pointer; }
      button:disabled { background: #d1d5db; color: #6b7280; cursor: default; }
      select { width: 100%; margin-top: 16px; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; }
      a { display: block; margin-top: 12px; text-align: center; color: #4b5563; font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="who">Attendance</h1>
      <p class="sub" id="today"></p>
      <div class="camera" id="cameraBox" hidden><video id="video" autoplay playsinline muted></video></div>
      <div class="line" id="cameraLine" hidden></div>
      <div class="line" id="locationLine" hidden></div>
      <div class="line" id="resultLine" hidden></div>
      <select id="reason" hidden aria-label="Why are you leaving?"></select>
      <button type="button" id="markButton" disabled>Please wait...</button>
      <a href="index.html" id="backLink">Back</a>
    </main>
    <script src="js/attendance.js?v=2" defer></script>
      <script src="js/sn-select.js?v=1" defer></script>
</body>
</html>
