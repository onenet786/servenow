<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance - ServeNow</title>
    <link rel="icon" type="image/png" href="images/servenow_brand_logo.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: #f3f6f4; color: #111827; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .page { display: flex; flex-direction: column; height: 100%; padding: 16px 20px 20px; gap: 16px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; border-radius: 16px; color: #fff;
        background: linear-gradient(120deg, #14532d, #15803d); box-shadow: 0 10px 24px rgba(20, 83, 45, .18); }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 44px; height: 44px; object-fit: cover; object-position: left center; border-radius: 11px; background: #fff; }
      .brand span { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #bbf7d0; }
      h1 { margin: 0; font-size: 22px; }
      .clock { text-align: right; }
      .clock b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
      .clock span { color: #dcfce7; font-size: 13.5px; }
      .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 44%) 1fr; gap: 20px; }
      .scanner { display: flex; flex-direction: column; gap: 12px; }
      .camera { aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #0f172a; box-shadow: 0 8px 22px rgba(15, 23, 42, .16); }
      video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
      #status { padding: 14px 16px; border-radius: 12px; background: #fff; border: 1px solid #e5e7eb; font-size: 20px; font-weight: 600; text-align: center; }
      #status.waiting { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
      .list { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
      #search { width: 100%; padding: 14px 16px; font: inherit; font-size: 17px; border: 1px solid #d1d5db; border-radius: 13px; background: #fff; }
      #search:focus { outline: none; border-color: #15803d; box-shadow: 0 0 0 3px rgba(21, 128, 61, .15); }
      #people { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-content: start; }
      .person { text-align: left; padding: 14px; min-height: 84px; border: 1px solid #e5e7eb; border-left: 6px solid #d1d5db; border-radius: 12px; background: #fff; cursor: pointer; font: inherit; color: inherit; }
      .person { font-family: inherit; box-shadow: 0 1px 3px rgba(15, 23, 42, .06); transition: transform .12s ease, box-shadow .12s ease; }
      .person:hover { border-color: #15803d; transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15, 23, 42, .1); }
      .person.in { border-left-color: #15803d; }
      .person.done { border-left-color: #6b7280; background: #f9fafb; }
      .person b { display: block; font-size: 17px; }
      .person small { display: block; margin-top: 2px; color: #4b5563; font-size: 13px; }
      .state { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; color: #4b5563; }
      .person.in .state { color: #15803d; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(17, 24, 39, 0.75); }
      .card { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; padding: 20px; background: #fff; border-radius: 16px; }
      .card .camera { max-height: 34vh; margin: 0 auto; }
      .card h2 { margin: 0 0 4px; font-size: 28px; }
      .card p { margin: 0 0 12px; color: #4b5563; font-size: 16px; }
      .actions { display: flex; gap: 12px; margin-top: 16px; }
      .actions button { flex: 1; padding: 18px; border: 0; border-radius: 12px; font-size: 20px; font-weight: 700; cursor: pointer; }
      #confirm { background: #15803d; color: #fff; }
      #confirm.out { background: #b45309; }
      #confirm:disabled { background: #d1d5db; color: #6b7280; cursor: default; }
      #cancel { flex: 0 0 130px; background: #e5e7eb; color: #111827; }
      .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
      .reasons button { padding: 14px 10px; border: 1px solid #d1d5db; border-radius: 12px; background: #fff; color: #111827; font-size: 17px; font-weight: 600; cursor: pointer; }
      .reasons button:hover { border-color: #b45309; }
      .reasons button.home { grid-column: 1 / -1; background: #b45309; border-color: #b45309; color: #fff; font-weight: 700; }
      .person.away { border-left-color: #b45309; }
      .person.away .state { color: #b45309; }
      .done-message { text-align: center; padding: 40px 12px; font-size: 26px; font-weight: 700; color: #166534; }
      .done-message.bad { color: #b91c1c; font-size: 20px; }
      .notice { padding: 32px; text-align: center; font-size: 18px; color: #4b5563; }
      @media (max-width: 800px) { .main { grid-template-columns: 1fr; overflow-y: auto; } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand"><img src="images/servenow_brand_logo.png" alt="" /><div><span>ServeNow</span><h1 id="title">ServeNow Attendance</h1></div></div>
        <div class="clock"><b id="clock"></b><span id="date"></span></div>
      </header>
      <div class="notice" id="notice" hidden></div>
      <div class="main" id="main">
        <div class="scanner">
          <div class="camera"><video id="live" autoplay playsinline muted></video></div>
          <div id="status">Starting camera...</div>
        </div>
        <div class="list">
          <input id="search" type="search" placeholder="Find your name" autocomplete="off" />
          <div id="people"></div>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="card">
        <div id="capture">
          <h2 id="personName"></h2>
          <p id="personNote"></p>
          <div class="camera"><video id="video" autoplay playsinline muted></video></div>
          <div class="reasons" id="reasons" hidden></div>
          <div class="actions">
            <button type="button" id="cancel">Cancel</button>
            <button type="button" id="confirm">Check In</button>
          </div>
        </div>
        <div class="done-message" id="result" hidden></div>
      </div>
    </div>
    <script src="js/face.js?v=1" defer></script>
    <script src="js/kiosk.js?v=6" defer></script>
  </body>
</html>
