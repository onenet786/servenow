<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Product Modal — Fixed UI &amp; Sticky Footer Verification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-simulation {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      width: 1120px;
      max-width: 96vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header-custom {
      padding: 0.85rem 1.4rem;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border-radius: 16px 16px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    .modal-header-custom h3 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .modal-header-custom .close-btn {
      color: #ffffff;
      font-size: 1.8rem;
      line-height: 1;
      opacity: 0.9;
      cursor: pointer;
      background: none;
      border: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    .modal-header-custom .close-btn:hover {
      opacity: 1;
      transform: scale(1.15);
    }
    .modal-body-custom {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 1.1rem 1.4rem;
      max-height: calc(90vh - 135px);
      background: #ffffff;
    }
    .modal-footer-custom {
      padding: 0.8rem 1.4rem;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      border-radius: 0 0 16px 16px;
      flex-shrink: 0;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .btn-secondary-custom {
      padding: 0.55rem 1.25rem;
      background: #ffffff;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }
    .btn-secondary-custom:hover {
      background: #f1f5f9;
      color: #1e293b;
    }
    .btn-primary-custom {
      padding: 0.55rem 1.5rem;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      transition: all 0.15s;
    }
    .btn-primary-custom:hover {
      background: linear-gradient(135deg, #4338ca, #3730a3);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body>

  <div class="modal-simulation">
    <!-- Header: Crisp White Title & Clearly Visible Close Button -->
    <div class="modal-header-custom">
      <h3><i class="fas fa-edit" style="color: #c7d2fe;"></i> Edit Product</h3>
      <button type="button" class="close-btn" title="Close Modal">&times;</button>
    </div>

    <!-- Scrollable Modal Body -->
    <div class="modal-body-custom">
      <form id="addProductForm">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.65rem;">
          
          <!-- Row 1: Core Info -->
          <div class="form-group">
            <label style="font-weight: 600; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Product Name:</label>
            <input type="text" value="Aghosh Special Nawabi Handi" style="width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;" />
          </div>
          <div class="form-group">
            <label style="font-weight: 600; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Use Existing Item:</label>
            <select style="width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;">
              <option>None</option>
            </select>
          </div>
          <div class="form-group">
            <label style="font-weight: 600; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Store:</label>
            <select style="width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;">
              <option>Aaghosh Hotel</option>
            </select>
          </div>
          <div class="form-group">
            <label style="font-weight: 600; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Category:</label>
            <select style="width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;">
              <option>Hotels</option>
            </select>
          </div>

          <!-- Multiple Units / Prices Checkbox & Mode -->
          <div class="form-group" style="grid-column: span 1; display: flex; align-items: flex-end; padding-bottom: 0.4rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 0; font-weight: 700; font-size: 0.82rem; color: #4f46e5;">
              <input type="checkbox" checked style="accent-color: #4f46e5; width: 16px; height: 16px;" />
              <span>MULTIPLE UNITS / PRICES</span>
            </label>
          </div>

          <div class="form-group" style="grid-column: span 1; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.75rem; background: #f8fafc; padding: 0.45rem 0.75rem; border-radius: 8px; border: 1px solid #e2e8f0;">
            <label style="font-weight: 700; margin-bottom: 0; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Mode:</label>
            <div style="display: flex; gap: 0.75rem; font-size: 0.85rem;">
              <label style="display: flex; align-items: center; gap: 0.25rem; font-weight: 700; color: #0f172a;">
                <input type="radio" name="mode" checked style="accent-color: #0284c7;" /> UNIT
              </label>
              <label style="display: flex; align-items: center; gap: 0.25rem; font-weight: 600; color: #64748b;">
                <input type="radio" name="mode" style="accent-color: #0284c7;" /> SIZE
              </label>
            </div>
          </div>

          <div style="grid-column: span 2;"></div>

          <!-- Discount Row -->
          <div style="grid-column: span 4; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 8px; padding: 0.6rem 0.85rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #78350f;">Discount Type:</label>
                <select style="width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;">
                  <option>Percentage (%)</option>
                  <option>Fixed Amount (PKR)</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #78350f;">Discount Value:</label>
                <input type="number" value="5" style="width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;" />
              </div>
            </div>
          </div>

          <!-- Multiple Variants Section -->
          <div style="grid-column: span 4; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.75rem; margin-top: 0.2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <h4 style="margin: 0; color: #1e293b; font-size: 0.92rem; font-weight: 700;">Unit prices:</h4>
              <div style="display: flex; align-items: center; gap: 12px;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #475569; font-weight: 600;">
                  <input type="checkbox" />
                  <span>Manual Variant Costs</span>
                </label>
                <button type="button" style="background: #0d9488; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 11.5px; font-weight: 700; cursor: pointer;">
                  <i class="fas fa-plus"></i> ADD UNIT PRICE
                </button>
              </div>
            </div>
            <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
              <thead>
                <tr style="border-bottom: 2px solid #f1f5f9; text-align: left;">
                  <th style="padding: 6px 8px; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem;">UNIT</th>
                  <th style="padding: 6px 8px; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; width: 160px;">PRICE (PKR)</th>
                  <th style="padding: 6px 8px; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; width: 160px;">COST PRICE (PKR)</th>
                  <th style="padding: 6px 8px; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; text-align: center; width: 60px;">ACTION</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom: 1px solid #f8fafc;">
                  <td style="padding: 6px 8px;">
                    <select style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;"><option>Half (H)</option></select>
                  </td>
                  <td style="padding: 6px 8px;"><input type="number" value="1150" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;" /></td>
                  <td style="padding: 6px 8px;"><input type="number" value="1095.00" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;" /></td>
                  <td style="padding: 6px 8px; text-align: center;">
                    <button type="button" style="background: #e2e8f0; color: #475569; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer;"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
                <tr>
                  <td style="padding: 6px 8px;">
                    <select style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;"><option>Full (F)</option></select>
                  </td>
                  <td style="padding: 6px 8px;"><input type="number" value="2200" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;" /></td>
                  <td style="padding: 6px 8px;"><input type="number" value="2090.00" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;" /></td>
                  <td style="padding: 6px 8px; text-align: center;">
                    <button type="button" style="background: #e2e8f0; color: #475569; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer;"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Price, Cost Price, Stock, Image -->
          <div class="form-group">
            <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Price (PKR): <small style="color: #6366f1; font-weight: normal;">(Min variant)</small></label>
            <input type="number" value="1150" readonly style="width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc;" />
          </div>
          <div class="form-group">
            <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Cost Price (PKR):</label>
            <input type="number" value="1095.00" style="width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px;" />
            <label style="display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: #64748b;">
              <input type="checkbox" />
              <span>MANUAL COST PRICE (FINANCIAL SETTLEMENTS WILL USE THIS VALUE)</span>
            </label>
          </div>
          <div class="form-group">
            <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Stock Quantity:</label>
            <input type="number" value="2000" style="width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px;" />
          </div>
          <div class="form-group">
            <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Image Upload:</label>
            <input type="file" style="width: 100%; font-size: 12px;" />
            <div style="margin-top: 6px; display: flex; align-items: center; gap: 8px;">
              <img src="https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=80&q=80" alt="Dish Preview" style="width: 42px; height: 42px; border-radius: 6px; object-fit: cover; border: 1px solid #cbd5e1;" />
              <span style="font-size: 11px; color: #16a34a; font-weight: 600;">Current image loaded</span>
            </div>
          </div>

          <!-- Time-Based Availability Section -->
          <div id="productTimeAvailabilitySection" style="grid-column: span 4; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.65rem 0.85rem; margin: 0.15rem 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem; flex-wrap: wrap; gap: 4px;">
              <label style="display: flex; align-items: center; gap: 0.45rem; font-weight: 700; color: #0f172a; font-size: 0.86rem; margin-bottom: 0;">
                <i class="fas fa-clock" style="color: #4f46e5;"></i>
                <span>Shift / Time-Based Availability (e.g. Breakfast 7am-12pm, Evening 4pm-7pm)</span>
              </label>
              <span style="font-size: 0.75rem; color: #64748b;">Leave blank for unrestricted all-day availability (24/7)</span>
            </div>
            <div style="display: grid; grid-template-columns: 140px 140px 1fr; gap: 0.75rem; align-items: flex-end;">
              <div class="form-group" style="margin-bottom: 0;">
                <label for="productAvailableFrom" style="font-size: 0.78rem; font-weight: 600; color: #334155; margin-bottom: 0.2rem; display: block;">Available From:</label>
                <input type="time" id="productAvailableFrom" name="available_from" style="width: 100%; padding: 0.38rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;" />
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label for="productAvailableTo" style="font-size: 0.78rem; font-weight: 600; color: #334155; margin-bottom: 0.2rem; display: block;">Available To:</label>
                <input type="time" id="productAvailableTo" name="available_to" style="width: 100%; padding: 0.38rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 0.2rem;">
                <span style="font-size: 0.75rem; font-weight: 600; color: #475569;">Quick Presets:</span>
                <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                  <button type="button" class="btn btn-tiny" onclick="applyTimePreset('07:00', '12:00')" style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; border-radius: 4px; padding: 3px 8px; font-size: 0.74rem; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-sun"></i> Breakfast (7am-12pm)
                  </button>
                  <button type="button" class="btn btn-tiny" onclick="applyTimePreset('12:00', '16:00')" style="background: #fef3c7; color: #b45309; border: 1px solid #fde68a; border-radius: 4px; padding: 3px 8px; font-size: 0.74rem; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-utensils"></i> Lunch (12pm-4pm)
                  </button>
                  <button type="button" class="btn btn-tiny" onclick="applyTimePreset('16:00', '19:00')" style="background: #fce7f3; color: #be185d; border: 1px solid #fbcfe8; border-radius: 4px; padding: 3px 8px; font-size: 0.74rem; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-mug-hot"></i> Evening (4pm-7pm)
                  </button>
                  <button type="button" class="btn btn-tiny" onclick="applyTimePreset('19:00', '23:59')" style="background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; border-radius: 4px; padding: 3px 8px; font-size: 0.74rem; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-moon"></i> Dinner (7pm-12am)
                  </button>
                  <button type="button" class="btn btn-tiny" onclick="applyTimePreset('', '')" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 8px; font-size: 0.74rem; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-infinity"></i> All Day (24/7)
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Description Field (Full 4 columns) -->
          <div class="form-group" style="grid-column: span 4; margin-bottom: 0;">
            <label style="font-weight: 700; font-size: 0.78rem; text-transform: uppercase; color: #475569;">Description:</label>
            <textarea rows="2" style="width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical;">Traditional Handi cooked in authentic clay pot with fresh boneless chicken, aromatic spices, butter, and rich cream.</textarea>
          </div>

        </div>
      </form>
    </div>

    <!-- Sticky Modal Footer: ALWAYS visible at bottom with Cancel & Update Product -->
    <div class="modal-footer-custom">
      <button type="button" class="btn-secondary-custom" onclick="alert('Cancelled')">
        <i class="fas fa-ban"></i> Cancel
      </button>
      <button type="button" class="btn-primary-custom" id="saveProductBtn" onclick="alert('Product Updated Successfully!')">
        <i class="fas fa-check"></i> Update Product
      </button>
    </div>

  </div>

  <script>
    function applyTimePreset(from, to) {
      document.getElementById('productAvailableFrom').value = from;
      document.getElementById('productAvailableTo').value = to;
    }
  </script>
</body>
</html>
