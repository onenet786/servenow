<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServeNow</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        .logo {
            display: none;
            margin-bottom: 20px;
        }

        .logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .logo h1 {
            margin: 0;
            color: #007bff;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(214, 82, 6, 0.1);
            display: none;
        }

        .login-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        p {
            margin-top: 20px;
            color: #555;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Mobile Landscape - Fit entire form in single screen */
        @media (max-height: 550px) and (orientation: landscape) {
            body {
                height: 100vh;
                padding: 0;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .login-container {
                border-radius: 6px;
                width: 92vw;
                max-width: 600px;
                height: auto;
                max-height: 88vh;
                overflow: hidden;
                padding: 0.25rem 0.45rem;
                background-color: rgba(255, 255, 255, 0.95);
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 0.5rem;
            }

            .logo {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-width: 80px;
                margin: 0;
            }

            .logo img {
                width: 70px;
                height: 70px;
                object-fit: contain;
                margin-bottom: 0;
            }

            .logo h1 {
                font-size: 0.9rem;
                margin: 0;
                color: #007bff;
                font-weight: 700;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
                display: none;
            }

            .login-form {
                display: flex;
                flex-direction: column;
                gap: 0;
                margin: 0;
                width: calc(100% - 85px);
                text-align: center;
                flex-shrink: 1;
            }

            .login-form h2 {
                margin: 0 0 0.08rem 0;
                font-size: 0.82rem;
                color: #333;
            }

            .form-group {
                margin: 0 0 0.18rem 0;
                text-align: left;
            }

            .form-group label {
                display: none;
            }

            .form-group input {
                width: 100%;
                padding: 0.3rem 0.38rem;
                font-size: 0.76rem;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
                margin: 0;
            }

            .btn-primary {
                background-color: #007bff;
                color: #fff;
                padding: 0.38rem;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                width: 100%;
                font-size: 0.78rem;
                margin: 0.1rem 0 0.05rem 0;
            }

            .btn-primary:hover {
                background-color: #0056b3;
            }

            p {
                margin: 0.08rem 0 0;
                color: #555;
                font-size: 0.66rem;
            }

            a {
                color: #007bff;
                text-decoration: none;
                font-size: 0.66rem;
            }

            a:hover {
                text-decoration: underline;
            }
        }

        /* Portrait view - show logo on top */
        @media (max-height: 550px) and (orientation: portrait) {
            .logo {
                display: block;
            }
        }

        /* Default - show logo on top */
        @media (min-height: 551px) {
            .logo {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="mobile_app/assets/icon/icon.png" alt="ServeNow Logo">
            <h1>ServeNow</h1>
        </div>
        <section class="login-form">
            <h2>Login to ServeNow</h2>
            <form id="loginForm" action="#" method="post">
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </section>
    </div>

    <script src="js/app.js?v=7"></script>
    <script>
        // Mobile menu toggle functionality
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        if (menuToggle && navMenu) {
            menuToggle.addEventListener('click', function() {
                navMenu.classList.toggle('active');
                menuToggle.classList.toggle('active');
            });

            // Close mobile menu when clicking on a link
            const navLinks = navMenu.querySelectorAll('a');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    navMenu.classList.remove('active');
                    menuToggle.classList.remove('active');
                });
            });

            // Close mobile menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!navMenu.contains(event.target) && !menuToggle.contains(event.target)) {
                    navMenu.classList.remove('active');
                    menuToggle.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
