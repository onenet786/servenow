<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServeNow Next | Forgot Password</title>
    <link rel="icon" type="image/png" href="/images/servenow_brand_logo.png" />
    <link rel="stylesheet" href="/next/assets/app.css" />
    <link rel="stylesheet" href="/next/assets/auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <aside class="auth-brand">
        <div class="auth-brand-card">
          <div class="auth-brand-top">
            <img src="/images/servenow_brand_logo.png" alt="ServeNow" />
            <div>
              <p class="eyebrow">Recovery</p>
              <h1>ServeNow Next</h1>
            </div>
          </div>
          <div class="stack">
            <h2>Recover access with your registered email.</h2>
            <p>This page follows the live backend recovery flow: request OTP, verify it, then create a new password.</p>
          </div>
        </div>
        <p><a href="/next/login" class="secondary-button">Back to login</a></p>
      </aside>

      <main class="auth-main">
        <section class="auth-panel">
          <section class="status-banner hidden" id="statusBanner"></section>
          <div class="auth-panel-copy">
            <p class="eyebrow">Forgot Password</p>
            <h2>Reset your password</h2>
            <p>We’ll send a one-time code to your email address.</p>
          </div>

          <form class="checkout-form" id="forgotPasswordRequestForm">
            <label>
              <span>Email</span>
              <input id="forgotEmail" type="email" name="email" required />
            </label>
            <button class="primary-button" type="submit">Send OTP</button>
          </form>

          <div class="auth-divider"></div>

          <form class="checkout-form" id="forgotPasswordVerifyForm">
            <div id="forgotOtpStep">
              <label>
                <span>OTP code</span>
                <input type="text" name="otp" minlength="6" maxlength="6" placeholder="Enter 6-digit OTP" required />
              </label>
            </div>

            <div id="forgotResetStep" class="hidden">
              <input id="forgotResetToken" type="hidden" name="token" />
              <label>
                <span>New password</span>
                <input type="password" name="password" minlength="6" />
              </label>
              <label>
                <span>Confirm password</span>
                <input type="password" name="confirmPassword" minlength="6" />
              </label>
            </div>

            <div class="auth-inline">
              <button class="primary-button" type="submit">Continue</button>
              <button class="ghost-button hidden" id="forgotBackBtn" type="button">Back</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="/next/assets/auth.js"></script>
  </body>
</html>
