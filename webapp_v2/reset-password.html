<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServeNow Next | Reset Password</title>
    <link rel="icon" type="image/png" href="/images/servenow_brand_logo.png" />
    <link rel="stylesheet" href="/next/assets/app.css" />
    <link rel="stylesheet" href="/next/assets/auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <aside class="auth-brand">
        <div class="auth-brand-card">
          <div class="auth-brand-top">
            <img src="/images/servenow_brand_logo.png" alt="ServeNow" />
            <div>
              <p class="eyebrow">Recovery</p>
              <h1>ServeNow Next</h1>
            </div>
          </div>
          <div class="stack">
            <h2>Create a new password from a reset link.</h2>
            <p>If you arrived here with a valid token, you can complete the password reset directly.</p>
          </div>
        </div>
      </aside>

      <main class="auth-main">
        <section class="auth-panel">
          <section class="status-banner hidden" id="statusBanner"></section>
          <div class="auth-panel-copy">
            <p class="eyebrow">Reset Password</p>
            <h2>Choose a new password</h2>
            <p>Use the token from your email link if it was provided there.</p>
          </div>

          <form class="checkout-form" id="resetPasswordForm">
            <input id="resetToken" type="hidden" name="token" />
            <label>
              <span>New password</span>
              <input type="password" name="password" minlength="6" required />
            </label>
            <label>
              <span>Confirm password</span>
              <input type="password" name="confirmPassword" minlength="6" required />
            </label>
            <button class="primary-button" type="submit">Reset password</button>
          </form>

          <div class="auth-links">
            <a href="/next/login">Back to login</a>
            <a href="/next/forgot-password">Use OTP recovery instead</a>
          </div>
        </section>
      </main>
    </div>

    <script src="/next/assets/auth.js"></script>
  </body>
</html>
